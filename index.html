<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Read A Light Born from Darkness, a manga story by Huzaifa."
    >
    <title>A Light Born from Darkness | MangaKhan</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #101018;
        color: #f5f1ed;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
        background:
          radial-gradient(ellipse at 50% 0, rgb(116 73 171 / 20%), transparent 48rem),
          #101018;
      }

      .site-header {
        border-bottom: 1px solid rgb(255 255 255 / 9%);
      }

      .header-inner {
        display: flex;
        width: min(100% - 40px, 1080px);
        min-height: 72px;
        align-items: center;
        justify-content: space-between;
        margin: 0 auto;
      }

      .brand {
        color: #fff;
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-decoration: none;
      }

      .brand span {
        color: #c7a2ff;
      }

      .header-note {
        color: #bcb8c5;
        font-size: 0.9rem;
      }

      main {
        width: min(100% - 32px, 920px);
        margin: 0 auto;
        padding: 72px 0 80px;
      }

      .story-heading {
        max-width: 680px;
        margin: 0 auto 32px;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: #c7a2ff;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 7vw, 4.5rem);
        letter-spacing: -0.045em;
        line-height: 1.05;
      }

      .byline {
        margin: 18px 0 0;
        color: #c1bdc9;
      }

      .byline strong {
        color: #fff;
      }

      .story-summary {
        max-width: 590px;
        margin: 16px auto 0;
        color: #aaa6b2;
        line-height: 1.7;
      }

      figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 14px;
        background: #08080c;
        box-shadow: 0 24px 80px rgb(0 0 0 / 40%);
      }

      figure img {
        display: block;
        width: 100%;
        height: auto;
      }

      figcaption {
        padding: 14px 18px;
        color: #aaa6b2;
        font-size: 0.88rem;
        text-align: center;
      }

      footer {
        padding: 22px 16px;
        border-top: 1px solid rgb(255 255 255 / 9%);
        color: #888491;
        font-size: 0.85rem;
        text-align: center;
      }

      @media (max-width: 600px) {
        .header-inner {
          min-height: 62px;
        }

        .header-note {
          font-size: 0.78rem;
        }

        main {
          padding-top: 52px;
        }

        figure {
          border-radius: 9px;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./" aria-label="MangaKhan home">Manga<span>Khan</span></a>
        <span class="header-note">A story worth discovering</span>
      </div>
    </header>

    <main>
      <article>
        <header class="story-heading">
          <p class="eyebrow">MangaKhan Original</p>
          <h1>A Light Born from Darkness</h1>
          <p class="byline">A story by <strong>Huzaifa</strong></p>
          <p class="story-summary">
            When danger finds a mother and her child, a hidden power awakens
            and changes their journey forever.
          </p>
        </header>

        <figure>
          <img
            src="manga-story.png"
            alt="A manga page following a mother and child through a dangerous encounter and the awakening of a radiant power."
            width="768"
            height="819"
          >
          <figcaption>Read the story, panel by panel.</figcaption>
        </figure>
      </article>
    </main>

    <footer>&copy; 2026 MangaKhan &middot; Story by Huzaifa</footer>
  </body>
</html>
